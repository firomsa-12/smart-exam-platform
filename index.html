<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Exam Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#081225;color:#f0f5ff;font-family:Arial,sans-serif}
.container{max-width:750px;margin:auto}
header{text-align:center;padding:20px 0}
h1,h2{color:#19d3c5}
.card{background:#111f38;border:1px solid #2b405f;border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;margin:14px 0 6px;color:#b9c9df}
input,textarea,select{width:100%;padding:12px;border:1px solid #38506e;border-radius:8px;background:#09162b;color:white;font-size:16px}
textarea{min-height:90px}
button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:8px;background:#19d3c5;color:#081225;font-size:15px;font-weight:bold;cursor:pointer}
.secondary{background:#3988ff;color:white}
.danger{background:#ff6577;color:white}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{background:#192b48;padding:12px;border-radius:8px;margin:12px 0;line-height:1.5}
.option{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#192b48;border-radius:8px;margin:8px 0; cursor:pointer;}
.option input{width:auto}
.small{color:#b9c9df;font-size:13px;line-height:1.5}
.timer{text-align:center;color:#19d3c5;font-size:24px;font-weight:bold;margin:15px}
.question{background:#192b48;padding:15px;border-radius:10px;margin:12px 0}
hr{border:0;border-top:1px solid #38506e;margin:20px 0}
@media(max-width:450px){.grid{grid-template-columns:1fr}}
a{color:#19d3c5;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎓 SMART EXAM PLATFORM</h1>
</header>

<section id="loginPage" class="card">
<h2>Student Login</h2>
<label>Student Name</label>
<input id="studentName" placeholder="Enter your full name">
<label>School Name</label>
<input id="schoolName" placeholder="Enter your school name">
<button id="continueBtn" type="button">Continue →</button>
<p id="loginMessage" class="small"></p>
</section>

<section id="menuPage" class="card hidden">
<h2>Student Dashboard</h2>
<p id="welcome"></p>
<div class="info">Total Questions available: <strong id="count">0</strong></div>

<label for="quizSet">Exam Set (Document)</label>
<select id="quizSet"><option value="All">All Sets</option></select>

<label for="examLimit">Number of questions for this session (Leave empty for all)</label>
<input id="examLimit" type="number" min="1" placeholder="e.g. 20">

<div class="grid">
<button id="examBtn">📝 Start Examination</button>
<button id="practiceBtn" class="secondary">📚 Start Practice</button>
<button id="addBtn" class="secondary">➕ Add Questions</button>
<button id="importBtn" class="secondary">📥 Import Questions</button>
<button id="bankBtn" class="secondary">🗂 Question Bank</button>
</div>
</section>

<section id="addPage" class="card hidden">
<h2>Add Questions Manually</h2>
<label>Subject</label>
<select id="addSubject">
<option>Physics</option><option>Chemistry</option><option>Biology</option>
<option>Mathematics</option><option>English</option><option>General</option>
</select>
<label>Set Name</label>
<input id="addSet" placeholder="e.g., Kinematics Manual">
<label>Duration (minutes)</label>
<input id="duration" type="number" min="1" max="600" value="30">
<button id="saveDurationBtn" class="secondary">Save Time Limit</button>
<p id="durationMessage" class="small"></p>
<hr>
<label>Question</label>
<textarea id="qText" placeholder="Enter your question"></textarea>
<label>Option A</label><input id="a" placeholder="Option A">
<label>Option B</label><input id="b" placeholder="Option B">
<label>Option C</label><input id="c" placeholder="Option C">
<label>Option D</label><input id="d" placeholder="Option D">

<div class="info">
  <strong>🤖 Need the answer?</strong>
  <p class="small">Open normal ChatGPT to find the correct answer automatically.</p>
  <button id="openChatGPTBtn" type="button" style="background:#10a37f; color:white;">Open ChatGPT to get Answer</button>
</div>

<label>Correct answer</label>
<select id="correct">
<option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option>
</select>
<button id="saveQuestionBtn">Save Question</button>
<p id="addMessage" class="small"></p>
<button class="backBtn secondary">← Back to Menu</button>
</section>

<section id="importPage" class="card hidden">
<h2>Import Questions</h2>
<label>Default subject</label>
<select id="importSubject">
<option>Physics</option><option>Chemistry</option><option>Biology</option>
<option>Mathematics</option><option>English</option><option>General</option>
</select>
<label>Document / Set Name</label>
<input id="importSetName" placeholder="e.g., Kinematics Test 1">
<label>Paste JSON questions</label>
<textarea id="jsonText" placeholder="Paste JSON here"></textarea>
<button id="importTextBtn">Import Pasted JSON</button>
<hr>
<label>Choose a file</label>
<input type="file" id="jsonFile" accept=".json,.txt,.pdf,.docx">
<button id="chooseFileBtn" class="secondary" type="button">Choose File</button>
<button id="importFileBtn" class="secondary" type="button">Import Selected File</button>
<p id="importMessage" class="small"></p>
<button class="backBtn secondary">← Back to Menu</button>
</section>

<section id="bankPage" class="card hidden">
<h2>Question Bank</h2>
<div id="bankContent"></div>
<button class="backBtn secondary">← Back to Menu</button>
</section>

<section id="quizPage" class="card hidden">
<h2 id="quizHeading">Examination</h2>
<div id="timer" class="timer"></div>
<p id="position" class="small"></p>
<div id="quizContent"></div>
<p id="quizMessage" class="small"></p>
<button id="nextBtn">Next Question →</button>
<button id="submitBtn" class="danger hidden">Submit Examination</button>
<button id="quitBtn" class="secondary" style="margin-top:10px;">🚪 Quit / Back to Menu</button>
</section>

<section id="resultPage" class="card hidden">
<h2>Results</h2>
<div id="resultStudent" class="info"></div>
<h1 id="score" style="text-align:center; font-size: 28px; color: #19d3c5;"></h1>
<p id="percentage" style="text-align:center; font-size: 20px; margin-bottom: 20px;"></p>
<div id="review"></div>
<button id="menuResultBtn">Return to Menu</button>
</section>
</div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const pages = ["loginPage","menuPage","addPage","importPage","bankPage","quizPage","resultPage"];
let questions = [], student = {name:"",school:""}, minutes = 30, quiz = [], answers = [], index = 0, mode = "", seconds = 0, timerId = null;
const SUBJECTS = ["Physics","Chemistry","Biology","Mathematics","English","General"];
const QUESTIONS_KEY = "smartExamFixedQuestions_v2"; 
const MINUTES_KEY = "smartExamFixedMinutes";

function normalizeSubject(value){ return SUBJECTS.includes(value) ? value : "General"; }
function normalizeSet(value){ return String(value || "").trim() || "Default Set"; }

try{
  const saved = JSON.parse(localStorage.getItem(QUESTIONS_KEY) || "[]");
  if(Array.isArray(saved)) questions = saved.filter(q => q && q.question).map(q => ({...q, subject: normalizeSubject(q.subject), setName: normalizeSet(q.setName)}));
  const savedMinutes = Number(localStorage.getItem(MINUTES_KEY));
  if(savedMinutes >= 1) minutes = savedMinutes;
}catch(e){}

function saveQuestions(){
  try { localStorage.setItem(QUESTIONS_KEY,JSON.stringify(questions)); updateCount(); } 
  catch(e) { alert("Storage full."); }
}
function updateCount(){ $("count").textContent = questions.length; }

function showPage(id){
  if(mode === "exam" && id !== "quizPage" && id !== "resultPage"){
    if(!confirm("Are you sure you want to quit the exam? Your progress will be lost.")) return;
    if(timerId) clearInterval(timerId);
    mode = "";
  }
  pages.forEach(p => $(p).classList.add("hidden"));
  $(id).classList.remove("hidden");
  updateCount();
}

function login(){
  const name = $("studentName").value.trim(), school = $("schoolName").value.trim();
  if(!name || !school){ $("loginMessage").textContent = "Enter name and school."; return; }
  student = {name,school}; $("welcome").textContent = "Welcome, " + name; showPage("menuPage");
}

/* CHATGPT BUTTON LOGIC */
$("openChatGPTBtn").onclick = function() {
    const q = $("qText").value.trim();
    const a = $("a").value.trim(), b = $("b").value.trim(), c = $("c").value.trim(), d = $("d").value.trim();
    if(!q || !a || !b || !c || !d) { alert("Please fill out the question and all 4 options first."); return; }
    
    const prompt = `What is the correct answer to this multiple-choice question? Reply with ONLY the letter (A, B, C, or D).\n\nQuestion: ${q}\nA) ${a}\nB) ${b}\nC) ${c}\nD) ${d}`;
    window.open("https://chatgpt.com/?q=" + encodeURIComponent(prompt), "_blank");
};

$("saveQuestionBtn").onclick = function() {
  const q = $("qText").value.trim(), opts = [$("a").value.trim(),$("b").value.trim(),$("c").value.trim(),$("d").value.trim()];
  if(!q || opts.some(x => !x)){ $("addMessage").textContent = "Complete all fields."; return; }
  questions.push({question:q, options:opts, answer:Number($("correct").value), subject:normalizeSubject($("addSubject").value), setName:normalizeSet($("addSet").value)});
  saveQuestions(); $("qText").value = ""; ["a","b","c","d"].forEach(id => $(id).value = ""); $("addMessage").textContent = "Question saved!";
};

$("continueBtn").onclick = login;
$("saveDurationBtn").onclick = function(){ const v = Number($("duration").value); if(v >= 1){ localStorage.setItem(MINUTES_KEY,v); minutes = v; $("durationMessage").textContent = "Saved."; } };
$("addBtn").onclick = () => { $("duration").value = minutes; showPage("addPage"); };
$("importBtn").onclick = () => showPage("importPage");
$("bankBtn").onclick = () => {
  const box = $("bankContent"); box.innerHTML = "";
  questions.forEach((q,i) => {
    const card = document.createElement("div"); card.className = "question";
    card.innerHTML = `<h3>[${q.subject}] ${q.question}</h3>` + q.options.map((o,j)=>`<p>${String.fromCharCode(65+j)}. ${o}</p>`).join("");
    const del = document.createElement("button"); del.textContent = "Delete"; del.className = "danger";
    del.onclick = () => { questions.splice(i,1); saveQuestions(); $("bankBtn").click(); }; card.appendChild(del); box.appendChild(card);
  });
  showPage("bankPage");
};

/* QUIZ ENGINE */
function startQuiz(type) {
  let aq = [...questions].sort(() => Math.random() - 0.5);
  const limit = parseInt($("examLimit").value);
  if(limit > 0 && limit < aq.length) aq = aq.slice(0, limit);
  if(!aq.length) { alert("No questions available."); return; }

  mode = type; quiz = aq; answers = new Array(quiz.length).fill(null); index = 0;
  $("quizHeading").textContent = type === "exam" ? "Examination in Progress" : "Practice Mode";
  $("submitBtn").classList.toggle("hidden", type !== "exam");
  
  if(type === "exam"){
    seconds = minutes * 60;
    $("timer").textContent = `Time Left: ${minutes}m`;
    if(timerId) clearInterval(timerId);
    timerId = setInterval(() => { seconds--; $("timer").textContent = `Time Left: ${Math.floor(seconds/60)}m ${seconds%60}s`; if(seconds <= 0) finishQuiz(); }, 1000);
  } else {
    $("timer").textContent = "Practice Mode (No Timer)";
    if(timerId) clearInterval(timerId);
  }
  showPage("quizPage"); renderQ();
}

$("examBtn").onclick = () => startQuiz("exam");
$("practiceBtn").onclick = () => startQuiz("practice");

window.selAns = (j) => { 
  answers[index] = j; 
  if(mode === "practice") { showFeedback(); }
};

function renderQ(){
  const q = quiz[index];
  $("position").textContent = `Question ${index+1} of ${quiz.length}`;
  $("quizMessage").textContent = "";
  
  let html = `<h3>${q.question}</h3>`;
  q.options.forEach((o,j) => {
    html += `<label class="option" id="opt-${j}">
      <input type="radio" name="choice" onchange="window.selAns(${j})" ${answers[index]===j?'checked':''} ${mode==='practice' && answers[index]!==null?'disabled':''}>
      <span>${String.fromCharCode(65+j)}. ${o}</span>
    </label>`;
  });
  $("quizContent").innerHTML = html;
  
  $("nextBtn").textContent = index === quiz.length - 1 ? "Finish" : "Next Question →";
  
  if(mode === "practice" && answers[index] !== null) showFeedback();
}

function showFeedback(){
  const q = quiz[index];
  for(let j=0; j<4; j++) {
    const el = $("opt-"+j);
    if(!el) continue;
    el.querySelector("input").disabled = true;
    if(j === q.answer) el.style.border = "2px solid #19d3c5";
    if(j === answers[index] && j !== q.answer) el.style.border = "2px solid #ff6577";
  }
  $("quizMessage").textContent = answers[index] === q.answer ? "✅ Correct!" : `❌ Incorrect. Correct answer: ${String.fromCharCode(65+q.answer)}`;
}

$("nextBtn").onclick = () => { 
  if(mode === "practice" && answers[index] === null) { $("quizMessage").textContent = "Please select an answer first."; return; }
  if(index < quiz.length-1){ index++; renderQ(); } 
  else { finishQuiz(); } 
};

$("submitBtn").onclick = () => { if(confirm("Submit exam?")) finishQuiz(); };

function finishQuiz(){
  if(timerId) clearInterval(timerId);
  let score = 0;
  quiz.forEach((q,i) => { if(answers[i] === q.answer) score++; });
  
  const percent = Math.round((score / quiz.length) * 100);
  
  $("resultStudent").textContent = `Student: ${student.name} · School: ${student.school}`;
  $("score").textContent = `Score: ${score} / ${quiz.length}`;
  $("percentage").textContent = `Percentage: ${percent}%`;
  
  let reviewHtml = "";
  quiz.forEach((q,i) => {
    reviewHtml += `<div class="question">
      <p><strong>Q${i+1}: ${q.question}</strong></p>
      <p class="small">Your answer: ${answers[i]!==null ? String.fromCharCode(65+answers[i]) : "None"}</p>
      <p class="small" style="color:#19d3c5;">Correct answer: ${String.fromCharCode(65+q.answer)}</p>
    </div>`;
  });
  $("review").innerHTML = reviewHtml;
  
  mode = ""; showPage("resultPage");
}

$("quitBtn").onclick = () => { if(mode==="exam" && !confirm("Quit exam?")) return; if(timerId) clearInterval(timerId); mode = ""; showPage("menuPage"); };
$("menuResultBtn").onclick = () => showPage("menuPage");
document.querySelectorAll(".backBtn").forEach(b => b.onclick = () => showPage("menuPage"));
updateCount();
})();
</script>
</body>
</html>
